# Builds the Windows installer for AartiMusic (desktop/).
#
# Runs when the desktop shell changes, or from the "Run workflow"
# button. It does not run on every change to the app's pages (www/):
# a Windows runner costs twice the minutes of a Linux one. To put new
# pages into the PC app, press "Run workflow".
name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/build-desktop.yml"

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install
        run: npm ci --no-audit --no-fund

      # Not signed: there is no certificate. Windows shows its
      # "unknown publisher" notice the first time the installer runs.
      - name: Build the installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist

      - name: Hand back the installer
        uses: actions/upload-artifact@v4
        with:
          name: aartimusic-windows
          path: desktop/dist/AartiMusic-Setup-*.exe
          if-no-files-found: error

      # The built app itself is started and driven: window, keyboard,
      # tray and taskbar controls, mini player, close-to-tray.
      - name: Try the built app
        shell: bash
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.62.1
          AARTI_EXE="$PWD/dist/win-unpacked/AartiMusic.exe" node test/smoke.cjs

      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aartimusic-windows-screens
          path: test-results/desktop-*.png
          if-no-files-found: ignore
