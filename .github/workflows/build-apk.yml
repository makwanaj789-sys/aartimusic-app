# ============================================================
#  Builds the Android APK on GitHub's machines.
#
#  Android Studio won't run on a phone, so nothing is built here —
#  push a change, GitHub does the work, and the finished APK comes
#  back as a downloadable file.
#
#  Run it from the repo: Actions → Build APK → Run workflow.
# ============================================================
name: Build APK

on:
  workflow_dispatch:          # the "Run workflow" button
  push:
    branches: [main, fix/working-apk-playlists]
    paths:
      - "www/**"
      - "assets/**"
      - "capacitor.config.json"
      - "package.json"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Java is what actually compiles the Android project.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # No setup-android step on purpose. The runner already ships with
      # the Android SDK — that action's only job is to fetch a newer
      # command-line tools package, and that download is what killed
      # the first build. The licences are accepted below instead.

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Playlist contract tests
        run: node --test tests/playlists.test.cjs tests/backup.test.cjs tests/lyrics.test.cjs tests/listening.test.cjs

      - name: Install browser test tools
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Player and Home interaction tests
        run: |
          node tests/ui-smoke.cjs
          node tests/capsule-ui.cjs
          node tests/queue-ui.cjs
          node tests/lyrics-ui.cjs
          node tests/queue-gestures-ui.cjs
          node tests/stats-mixes-ui.cjs

      - name: Save UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aarti-ui-checks
          path: test-results/
          if-no-files-found: ignore

      # Standard media-session launch intent and ongoing notification.
      - name: Two lines the media notification is missing
        run: python3 scripts/media-session-patch.py

      # The android/ folder is generated rather than committed, so the
      # repo stays small and there is no build output to keep in sync.
      # --yes stops npx pausing to ask whether it may fetch the CLI,
      # which a machine with nobody watching can never answer.
      - name: Use a separate package for the review APK
        if: github.ref != 'refs/heads/main'
        run: |
          node -e 'const fs=require("fs"); const file="capacitor.config.json"; const c=JSON.parse(fs.readFileSync(file)); c.appId="com.aartimusic.player.preview.v3"; c.appName="AartiMusic"; fs.writeFileSync(file,JSON.stringify(c,null,2));'

      - name: Create the Android project
        run: |
          npx --yes cap add android || true
          npx --yes cap sync android

      # Two permissions no plugin declares for us, and the category
      # that says this is a music app. Android 14 will not start the
      # media foreground service without the first permission, Android
      # 13 hides every notification until the second is granted, and a
      # player that never says it is a player is easy for a phone's own
      # music UI to leave out. Re-running changes nothing.
      - name: Manifest bits the notification needs
        run: python3 scripts/android-manifest.py android/app/src/main/AndroidManifest.xml

      # Publish the existing token to standard Android media-browser clients.
      - name: Say this is a music player
        run: python3 scripts/android-media-app.py

      # The one thing the WebView cannot answer for itself: what the
      # sound is actually coming out of. Chrome on Android does not
      # enumerate audio outputs, so this writes the small class that
      # asks Android and registers it with the bridge.
      - name: Ask Android what it is playing through
        run: python3 scripts/android-audio-out.py

      # Turns assets/icon.png into every icon size Android wants,
      # including the adaptive pair. Skipped quietly if the folder
      # isn't there, so a missing icon never fails the build.
      - name: Export premium icon sizes
        run: node scripts/premium-icon.cjs

      - name: Make the icons
        run: |
          if [ -f assets/icon.png ]; then
            npx --yes @capacitor/assets generate --android
          else
            echo "no assets/icon.png — keeping the default icon"
          fi

      - name: Install backup picker and launcher icon choices
        run: python3 scripts/android-personal-library.py

      - name: Install native floating capsule
        run: python3 scripts/android-capsule.py

      # Keep review-build identity stable across future CI runs.
      # The earlier preview key was ephemeral; Next installs alongside it.
      - name: Reuse the review signing key
        if: github.ref != 'refs/heads/main'
        uses: actions/cache@v4
        with:
          path: .ci-signing/review.keystore
          key: aartimusic-review-signing-v3

      - name: Prepare explicit review signing
        if: github.ref != 'refs/heads/main'
        run: |
          mkdir -p .ci-signing
          if [ ! -s .ci-signing/review.keystore ]; then
            keytool -genkeypair -keystore .ci-signing/review.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          python3 scripts/review-signing.py

      - name: Build the APK
        working-directory: android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify review signing cache input
        if: github.ref != 'refs/heads/main'
        run: |
          test -s .ci-signing/review.keystore
          keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk
          python3 scripts/review-signing.py --verify

      - name: Hand back the APK
        uses: actions/upload-artifact@v4
        with:
          name: aarti-music-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
